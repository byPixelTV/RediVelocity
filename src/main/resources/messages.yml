config-version: 1

prefix: "<dark_grey>[<gradient:#08a8f8:#00e1ff:#08a8f8>RediVelocity</gradient>]</dark_grey>"

playerversion_unsupported: "<grey>Your client version <#dc2626>is not supported</#dc2626> on this server.</grey>"

commands:
  send:
    player_not_found: "<prefix> <grey>The player <#dc2626><player></#dc2626> was not found on the network!</grey>"
    sent_player: "<prefix> <grey>Trying to send you to <#4bfb00><server></#4bfb00>...</grey>"
    send_failed: "<prefix> <grey>Failed to send you to <#dc2626><server></#dc2626>. Please try again later.</grey>"
    sent_admin: "<prefix> <grey>Trying to send <#4bfb00><player></#4bfb00> to <#4bfb00><server></#4bfb00>...</grey>"
    sent_admin_failed: "<prefix> <grey>Failed to send <#dc2626><player></#dc2626> to <#dc2626><server></#dc2626>.</grey>"
    already_connected: "<prefix> <grey><player> is already connected to <#dc2626><server></#dc2626>!</grey>"
  alert:
    alert_message: "<prefix> <message>"
  alert-raw:
    alert_message: "<message>"
  find:
    player_not_found: "<prefix> <grey>The player <#dc2626><player></#dc2626> was not found on the network!</grey>"
    player_info: "<prefix> <grey>Player <#4bfb00><player></#4bfb00> is connected to <#4bfb00><server></#4bfb00> on proxy <#4bfb00><proxy></#4bfb00>.</grey>"
  redivelocity:
    player:
      general:
        not_found: "<prefix> <grey>The player <#dc2626><player></#dc2626> was not found on the network!</grey>"
      info:
        msg: "<prefix> <grey>Player Information for <#08a8f8><player></#08a8f8>:</grey>"
        uuid: "    <grey>● UUID: <#08a8f8><uuid></#08a8f8></grey>"
        proxy: "   <grey>● Connected Proxy: <#08a8f8><proxy></#08a8f8></grey>"
        server: "  <grey>● Connected Server: <#08a8f8><server></#08a8f8></grey>"
        address: " <grey>● IP Address: <#08a8f8><address></#08a8f8></grey>"
    proxy:
      list:
        msg: "<prefix> <grey>List of connected proxies (<#4bfb00><all_proxies></#4bfb00>):</grey>"
        proxy_entry: "   <grey>● <#08a8f8><proxy></#08a8f8> (<#4bfb00><player_count></#4bfb00> players)</grey>"
      info:
        proxy_not_found: "<prefix> <grey>The proxy <#dc2626><proxy></#dc2626> was not found!</grey>"
        msg: "<prefix> <grey>Proxy Information for <#08a8f8><proxy></#08a8f8>:</grey>"
        id: "    <grey>● ID: <#08a8f8><proxy></#08a8f8></grey>"
        is_leader: "    <grey>● Is Leader: <is_leader></grey>"
        player_count: "    <grey>● Connected Players: <#4bfb00><player_count></#4bfb00></grey>"
